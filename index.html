<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Litigation · Canticle</title>
<style>
:root {
  --bg: #0d1117; --bg2: #161b22; --bg3: #1c2331;
  --border: #2d3748; --text: #e6edf3; --dim: #8b949e;
  --accent: #f59e0b; --user: #2563eb;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: -apple-system, 'Segoe UI', Roboto, sans-serif; background: var(--bg); color: var(--text); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
.chat-shell { min-height: 0; flex: 1; display: flex; }

/* Sidebar */
#sidebar { width: 270px; min-width: 270px; background: var(--bg2); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
#sidebar header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; }
#sidebar header h1 { font-size: 16px; letter-spacing: .05em; color: var(--accent); }
#gavel { font-size: 20px; }
#room-list { flex: 1; overflow-y: auto; padding: 4px 8px; }
.room-item { padding: 10px 12px; border-radius: 8px; cursor: pointer; margin-bottom: 2px; display: flex; justify-content: space-between; align-items: center; }
.room-item:hover { background: var(--bg3); }
.room-item.active { background: var(--bg3); outline: 1px solid var(--border); }
.room-item .title { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room-item .meta { font-size: 10px; color: var(--dim); margin-top: 2px; }
.room-item .del { color: var(--dim); border: none; background: none; cursor: pointer; font-size: 14px; padding: 2px 4px; border-radius: 4px; }
.room-item .del:hover { color: #f87171; background: rgba(248,113,113,.1); }

/* Main */
#main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
#topbar { padding: 10px 18px; border-bottom: 1px solid var(--border); background: var(--bg2); display: flex; align-items: center; gap: 12px; min-height: 54px; }
#room-title { font-size: 14px; font-weight: 600; flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pill { font-size: 10px; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--border); color: var(--dim); }
.topbtn { padding: 6px 12px; font-size: 12px; border-radius: 6px; border: 1px solid var(--border); background: var(--bg3); color: var(--text); cursor: pointer; }
.topbtn:hover { border-color: var(--accent); color: var(--accent); }
.topbtn.on { border-color: var(--accent); color: var(--accent); background: rgba(245,158,11,.08); }

/* Chat */
#chat { flex: 1; overflow-y: auto; padding: 20px 0; }
.msg { max-width: 72%; margin: 6px 24px; }
.msg .bubble { padding: 10px 14px; border-radius: 12px; background: var(--bg3); border: 1px solid var(--border); font-size: 13.5px; line-height: 1.55; white-space: pre-wrap; word-wrap: break-word; }
.msg .who { font-size: 11px; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
.msg .dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.msg.user { margin-left: auto; }
.msg.user .bubble { background: rgba(37,99,235,.18); border-color: rgba(37,99,235,.4); }
.msg .raw-btn { font-size: 9px; color: var(--dim); background: none; border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; cursor: pointer; }
.msg .raw-btn:hover { color: var(--accent); }
.msg .raw-view { margin-top: 6px; font-family: ui-monospace, monospace; font-size: 10.5px; color: var(--dim); background: rgba(0,0,0,.3); padding: 8px; border-radius: 6px; white-space: pre-wrap; }
.msg.ring-msg .bubble { border-style: dashed; }
.bubble .ring-kind { font-size: 9px; letter-spacing: .08em; text-transform: uppercase; opacity: .7; }
.bubble .toksaved { font-size: 9px; color: var(--accent); margin-top: 6px; opacity: .8; }
.typing { font-size: 11px; color: var(--dim); margin: 4px 24px; font-style: italic; }

/* Coding-mode diff bubbles */
.diffview { background: #0d1117; border: 1px dashed var(--border); border-radius: 8px; padding: 10px 12px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11.5px; line-height: 1.45; white-space: pre; overflow-x: auto; overflow-y: auto; max-height: 340px; color: #c9d1d9; margin: 4px 0 0; }
.diffview .add { color: #3fb950; } .diffview .del { color: #f85149; } .diffview .meta { color: #8b949e; }
.msg.diff-msg { max-width: 86%; }

/* Court verdict card */
.verdict-card { max-width: 82%; margin: 14px 24px; border: 1px solid var(--accent); border-radius: 12px; overflow: hidden; }
.verdict-card .vh { background: rgba(245,158,11,.12); padding: 10px 14px; font-size: 12px; font-weight: 700; color: var(--accent); letter-spacing: .04em; }
.verdict-card .vb { padding: 12px 14px; background: var(--bg2); }
.bar-row { display: flex; align-items: center; gap: 8px; margin: 5px 0; font-size: 12px; }
.bar-row .bar { height: 10px; border-radius: 5px; background: var(--accent); min-width: 4px; transition: width .4s; }
.verdict-card .q { font-size: 11px; color: var(--dim); margin-bottom: 8px; }
.verdict-card .votes { margin-top: 10px; border-top: 1px solid var(--border); padding-top: 8px; }
.verdict-card .vote-row { font-size: 11.5px; margin: 6px 0; }
.verdict-card .vote-row .r { color: var(--dim); }

/* Composer */
#composer-wrap { border-top: 1px solid var(--border); background: var(--bg2); padding: 10px 18px 14px; }
#targets { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
.tchip { font-size: 11px; padding: 3px 10px; border-radius: 99px; cursor: pointer; border: 1px solid var(--border); color: var(--dim); user-select: none; }
.tchip.sel { color: var(--text); font-weight: 600; }
.tchip.sel.on { border-color: currentColor; }
#composer { display: flex; gap: 10px; }
#input { flex: 1; resize: none; background: var(--bg3); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; font-family: inherit; max-height: 140px; }
#input:focus { outline: none; border-color: var(--accent); }
#send { padding: 0 22px; background: var(--user); color: white; border: none; border-radius: 10px; font-weight: 600; cursor: pointer; }
#send:disabled { opacity: .4; cursor: not-allowed; }

/* Modal */
#modal-bg { position: fixed; inset: 0; background: rgba(0,0,0,.65); display: none; align-items: center; justify-content: center; z-index: 120; }
#modal-bg.show { display: flex; }
#modal { background: var(--bg2); border: 1px solid var(--border); border-radius: 14px; width: 680px; max-width: calc(100vw - 24px); max-height: 85vh; overflow-y: auto; padding: 20px; }
#modal h2 { font-size: 15px; margin-bottom: 14px; }
.model-group { margin: 14px 0 8px; color: var(--dim); font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.model-row { display: grid; grid-template-columns: auto auto minmax(180px, 1fr) 145px auto; align-items: center; gap: 10px; padding: 10px; border: 1px solid var(--border); border-radius: 9px; margin-bottom: 8px; }
.model-row.subscription { border-color: rgba(245,158,11,.45); background: rgba(245,158,11,.035); }
.model-row.off { opacity: .72; }
.model-row input[type=checkbox] { accent-color: var(--accent); }
.model-row .m-name { font-size: 13px; font-weight: 600; }
.model-row .m-model { font-size: 10px; color: var(--dim); }
.model-row .m-meta { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 4px; }
.model-row .m-badge { font-size: 9px; color: var(--dim); border: 1px solid var(--border); border-radius: 99px; padding: 1px 6px; }
.model-row .m-status.verified { color: #4ade80; }
.model-row .m-status.error, .model-row .m-status.blocked { color: #f87171; }
.model-row .m-hint { grid-column: 3 / -1; color: var(--dim); font-size: 10px; line-height: 1.35; }
.model-row input[type=text] { width: 145px; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 5px 8px; font-size: 10.5px; }
.check-model { min-width: 104px; padding: 6px 8px; border-radius: 6px; border: 1px solid var(--border); color: var(--text); background: var(--bg3); font-size: 10.5px; cursor: pointer; }
.check-model:hover { border-color: var(--accent); color: var(--accent); }
.check-model:disabled { opacity: .55; cursor: wait; }
@media (max-width: 640px) {
  .chat-shell { flex-direction: column; }
  #sidebar { width: 100%; min-width: 0; max-height: 31vh; border-right: 0; border-bottom: 1px solid var(--border); }
  #room-list { min-height: 54px; }
  #main { min-height: 0; }
  #topbar { flex-wrap: wrap; padding: 8px 10px; }
  #room-title { flex: 1 0 100%; }
  .msg, .verdict-card { max-width: calc(100% - 24px); margin-right: 12px; margin-left: 12px; }
  #composer-wrap { padding: 8px 10px 10px; }
  #send { padding: 0 14px; }
  .model-row { grid-template-columns: auto auto 1fr auto; }
  .model-row input[type=text] { grid-column: 3 / -1; width: 100%; }
  .model-row .m-hint { grid-column: 3 / -1; }
}
#modal label.ck { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--dim); margin: 12px 0; }
#modal .actions { display: flex; gap: 10px; margin-top: 16px; }
#modal .actions button { flex: 1; padding: 9px; border-radius: 8px; border: none; cursor: pointer; font-weight: 600; }
#create-btn { background: var(--accent); color: #111; }
#cancel-btn { background: var(--bg3); color: var(--text); border: 1px solid var(--border); }
#empty-state { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; color: var(--dim); }
#empty-state .big { font-size: 44px; }
::-webkit-scrollbar { width: 8px; } ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
</style>

</head>
<body class="cc-cosmic litigation-chat">
<a class="cc-skip-link" href="#main-content">Skip to workspace</a>
<header class="litigation-nav">
  <a class="litigation-nav__brand cc-brand" href="/" aria-label="Canticle Litigation home"><img src="/branding/canticle-lockup.svg?v=1.0.0" alt="Canticle"><span class="litigation-nav__product">Litigation</span></a>
  <nav class="litigation-nav__tabs" aria-label="Workspace sections">
    <a href="/" aria-current="page">Chat</a><a href="/projects">Projects</a><a href="/rules">Rules</a><a href="/knowledge">Knowledge</a>
  </nav>
  <div class="litigation-nav__actions"><button class="litigation-nav__new" id="new-room-btn" type="button">New chat</button></div>
</header>
<div class="chat-shell" id="main-content">
<div id="sidebar">
  <div id="room-list"></div>
</div>
<div id="main">
  <div id="topbar" style="display:none">
    <div id="room-title"></div>
    <span class="pill" id="room-members"></span>
    <button class="topbtn" id="crosstalk-btn" title="Let agents see and reply to each other via the decoder ring">Ring: off</button>
    <button class="topbtn" id="code-btn" title="Coding mode: qualified coding agents edit the shared workspace; chat-only subscription agents review without file access">Code: off</button>
    <button class="topbtn" id="add-counsel-btn" title="Add subscription counsel to this room">+ Counsel</button>
    <button class="topbtn" id="vote-btn" title="Ask every participant for a verdict">⚖ Call vote</button>
  </div>
  <div id="chat"></div>
  <div id="empty-state"><span class="big">⚖️</span><div>No room open</div><div style="font-size:12px">Create a chat and pick your counsel — one model, or all of them.</div></div>
  <div id="composer-wrap" style="display:none">
    <div id="targets"></div>
    <div id="composer">
      <textarea id="input" rows="1" placeholder="Message the room… (click chips below to address specific models)"></textarea>
      <button id="send">Send</button>
    </div>
  </div>
</div>
</div>
<div id="modal-bg">
  <div id="modal">
    <h2 id="modal-title">New chat room</h2>
    <div id="model-rows"></div>
    <input type="text" id="ws-input" placeholder="Shared git workspace for coding mode (optional) — e.g. ~/Projects/myapp"
           style="width:100%; box-sizing:border-box; margin:10px 0 2px; padding:8px 10px; background:var(--bg3); border:1px solid var(--border); border-radius:6px; color:var(--text); font-size:12px;">
    <label class="ck"><input type="checkbox" id="ct-check"> Enable decoder-ring cross-talk (agents reply to each other)</label>
    <div class="actions">
      <button id="cancel-btn">Cancel</button>
      <button id="create-btn">Open room</button>
    </div>
  </div>
</div>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) =>
  ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const state = {
  models: [],          // safe provider metadata from /api/models
  rooms: [],
  room: null,          // current room {id,title,participants,crosstalk,workspace,messages}
  codeMode: false,     // coding mode toggle for the current room
  selected: new Set(), // targeted agent ids for the next message (empty = all)
  busy: false,
  agentColor: {}, agentLabel: {},
  setup: null,         // includes subscription_only; defaults to subscription-only until loaded
};

const api = {
  async json(url, opts = {}) {
    const r = await fetch(url, {
      headers: {'Content-Type': 'application/json'}, ...opts });
    if (!r.ok) throw new Error((await r.json().catch(() => ({}))).detail || r.statusText);
    return r.json();
  },
  models: () => api.json('/api/models'),
  setup: () => api.json('/api/setup'),
  checkModel: (id) => api.json('/api/models/' + encodeURIComponent(id) + '/check', {method: 'POST'}),
  rooms: () => api.json('/api/rooms'),
  room: (id) => api.json('/api/rooms/' + id),
  createRoom: (body) => api.json('/api/rooms', {method: 'POST', body: JSON.stringify(body)}),
  delRoom: (id) => api.json('/api/rooms/' + id, {method: 'DELETE'}),
  patchRoom: (id, body) => api.json('/api/rooms/' + id, {method: 'PATCH', body: JSON.stringify(body)}),
  vote: (id, q) => api.json('/api/rooms/' + id + '/vote',
    {method: 'POST', body: JSON.stringify({question: q})}),
};

function syncAgentMeta() {
  for (const m of state.models) {
    state.agentColor[m.id] = m.color;
    state.agentLabel[m.id] = m.label;
  }
  if (state.room) for (const p of state.room.participants) {
    state.agentLabel[p.id] = p.label || state.agentLabel[p.id] || p.id;
  }
}
const canonicalProviderId = (id) => ({
  gpt: 'openai', codex: 'openai', chatgpt: 'openai',
  antigravity: 'gemini', agy: 'gemini',
}[id] || id);
const colorOf = (id) => state.agentColor[id] || state.agentColor[canonicalProviderId(id)] || '#8b949e';
const labelOf = (id) => state.agentLabel[id] || id;

/* ---------------- Sidebar ---------------- */

async function refreshRooms() {
  state.rooms = await api.rooms();
  const list = $('room-list');
  list.innerHTML = '';
  for (const r of state.rooms) {
    const div = document.createElement('div');
    div.className = 'room-item' + (state.room && r.id === state.room.id ? ' active' : '');
    div.innerHTML =
      `<div style="min-width:0"><div class="title">${esc(r.title)}</div>
       <div class="meta">${r.participants.map(p => esc(participantDisplay(p))).join(' · ')}</div></div>
       <button class="del" title="Delete room">✕</button>`;
    div.onclick = () => openRoom(r.id);
    div.querySelector('.del').onclick = async (e) => {
      e.stopPropagation();
      if (!confirm('Delete this room?')) return;
      await api.delRoom(r.id);
      if (state.room && state.room.id === r.id) { state.room = null; renderRoom(); }
      refreshRooms();
    };
    list.appendChild(div);
  }
}

/* ---------------- New room modal ---------------- */

// The server's check endpoint accepts exactly these subscription routes;
// `antigravity` is the hidden alias of `gemini`.
const CHECKABLE_SUBSCRIPTIONS = new Set(['claude', 'grok', 'gemini', 'glm', 'cline', 'openai', 'astra']);
const SUBSCRIPTION_ORDER = ['grok', 'gemini', 'glm', 'cline', 'claude', 'openai', 'astra'];

const isSubscriptionBilled = (m) => m.billing === 'subscription';
const isLocalServer = (m) => !!m.local;
const isCliTransport = (m) => String(m.transport || '').toLowerCase().includes('cli');
const subscriptionOnly = () => !state.setup || state.setup.subscription_only !== false;

function providerGroups() {
  const byId = new Map(state.models.map(m => [m.id, m]));
  const subscription = state.models
    .filter(m => isSubscriptionBilled(m) && m.id !== 'antigravity');
  const orderedSubs = [
    ...SUBSCRIPTION_ORDER.map(id => byId.get(id)).filter(Boolean),
    ...subscription.filter(m => !SUBSCRIPTION_ORDER.includes(m.id)),
  ];
  const rest = state.models.filter(m => !isSubscriptionBilled(m) && m.id !== 'antigravity');
  const groups = [['Subscription accounts', orderedSubs]];
  if (!subscriptionOnly()) {
    groups.push(
      ['API models', rest.filter(m => !isLocalServer(m))],
      ['Local models', rest.filter(isLocalServer)],
    );
  }
  return groups;
}

async function refreshModels() {
  state.models = await api.models();
  syncAgentMeta();
}

function modelStatus(m) {
  if (m.connection_status === 'verified') return ['Verified now', 'verified'];
  if (m.connection_status === 'error') return ['Needs attention', 'error'];
  const labels = {
    installed_unverified: 'Installed · not verified',
    configured_unverified: 'Configured · not verified',
    not_installed: 'Not installed',
    not_configured: 'Setup needed',
    safety_blocked: 'Policy blocked',
  };
  return [labels[m.setup_status] || 'Not verified', m.setup_status === 'safety_blocked' ? 'blocked' : ''];
}

function captureModelForm() {
  const values = {};
  for (const row of $('model-rows').querySelectorAll('.model-row')) {
    const cb = row.querySelector('input[type=checkbox]');
    values[cb.dataset.id] = {
      checked: cb.checked,
      model: row.querySelector('input[type=text]').value,
    };
  }
  return values;
}

function renderModelRows(saved = {}, excludeIds = null) {
  const wrap = $('model-rows');
  wrap.innerHTML = '';
  for (const [title, models] of providerGroups()) {
    const visible = models.filter(m => !excludeIds || !excludeIds.has(m.id));
    if (!visible.length) continue;
    const heading = document.createElement('div');
    heading.className = 'model-group';
    heading.textContent = title;
    wrap.appendChild(heading);
    for (const m of visible) {
      const subscription = isSubscriptionBilled(m);
      const [status, statusClass] = modelStatus(m);
      const transport = m.transport || 'provider API';
      const billing = subscription
        ? 'Subscription'
        : m.local
          ? 'Local'
          : isCliTransport(m)
            ? 'CLI account'
            : 'API billing';
      const hint = m.check_message || m.blocked_reason || m.setup_hint || '';
      const prior = saved[m.id] || {};
      const row = document.createElement('div');
      row.className = 'model-row' + (subscription ? ' subscription' : '') + (m.available ? '' : ' off');
      row.innerHTML =
        `<input type="checkbox" data-id="${esc(m.id)}" ${m.available ? '' : 'disabled'} ${prior.checked && m.available ? 'checked' : ''}>
       <span class="dot" style="width:10px;height:10px;border-radius:50%;background:${esc(m.color)}"></span>
         <div><div class="m-name">${esc(m.label)}</div>
         <div class="m-model">${esc(m.model || 'provider default')}</div>
         <div class="m-meta"><span class="m-badge">${esc(billing)}</span><span class="m-badge">${esc(transport)}</span><span class="m-badge m-status ${statusClass}">${esc(status)}</span></div></div>
         <input type="text" value="${esc(prior.model || '')}" placeholder="model override" title="Model id override">
         ${CHECKABLE_SUBSCRIPTIONS.has(m.id) ? `<button type="button" class="check-model" data-id="${esc(m.id)}">Test connection</button>` : '<span></span>'}
         ${hint ? `<div class="m-hint">${esc(hint)}</div>` : ''}`;
      wrap.appendChild(row);
    }
  }
}

// The picker serves two modes: creating a room, or adding counsel to an
// already-started conversation.
let modalMode = 'create';

function setModalMode(mode) {
  modalMode = mode;
  const adding = mode === 'add';
  $('modal-title').textContent = adding
    ? `${subscriptionOnly() ? 'Add subscription counsel' : 'Add models'} to ${state.room ? state.room.title : 'this room'}`
    : (subscriptionOnly() ? 'New subscription chat' : 'New chat room');
  $('create-btn').textContent = adding ? 'Add to room' : 'Open room';
  $('ws-input').style.display = adding ? 'none' : '';
  const ctLabel = $('ct-check').closest('label');
  if (ctLabel) ctLabel.style.display = adding ? 'none' : '';
}

async function openModal() {
  setModalMode('create');
  $('modal-bg').classList.add('show');
  $('model-rows').innerHTML = '<div class="model-group">Refreshing provider status…</div>';
  try {
    await refreshModels();
    renderModelRows();
  } catch (e) {
    $('model-rows').innerHTML = `<div class="m-hint">Could not refresh providers: ${esc(e.message)}</div>`;
  }
}

async function openAddModal() {
  if (!state.room) return;
  setModalMode('add');
  $('modal-bg').classList.add('show');
  $('model-rows').innerHTML = '<div class="model-group">Refreshing provider status…</div>';
  try {
    await refreshModels();
    renderModelRows({}, new Set(state.room.participants.map(p => canonicalProviderId(p.id))));
  } catch (e) {
    $('model-rows').innerHTML = `<div class="m-hint">Could not refresh providers: ${esc(e.message)}</div>`;
  }
}

async function checkModel(id, button) {
  const saved = captureModelForm();
  button.disabled = true;
  button.textContent = 'Checking…';
  try {
    await api.checkModel(id);
    await refreshModels();
    renderModelRows(saved, modalMode === 'add'
      ? new Set(state.room.participants.map(p => canonicalProviderId(p.id))) : null);
  } catch (e) {
    button.disabled = false;
    button.textContent = 'Try again';
    alert(e.message);
  }
}

function pickedParticipants() {
  const participants = [];
  for (const row of $('model-rows').querySelectorAll('.model-row')) {
    const cb = row.querySelector('input[type=checkbox]');
    if (!cb.checked) continue;
    const override = row.querySelector('input[type=text]').value.trim();
    participants.push({id: cb.dataset.id, ...(override ? {model: override} : {})});
  }
  return participants;
}

async function createRoom() {
  const participants = pickedParticipants();
  if (!participants.length) { alert('Pick at least one model.'); return; }
  if (modalMode === 'add') {
    state.room = await api.patchRoom(state.room.id, {
      participants: [...state.room.participants, ...participants]});
    $('modal-bg').classList.remove('show');
    syncAgentMeta();
    renderRoom();
    refreshRooms();
    return;
  }
  const room = await api.createRoom({
    participants, crosstalk: $('ct-check').checked,
    workspace: $('ws-input').value.trim()});
  $('modal-bg').classList.remove('show');
  await refreshRooms();
  openRoom(room.id);
}

/* ---------------- Room view ---------------- */

async function openRoom(id) {
  state.room = await api.room(id);
  state.selected = new Set();
  state.codeMode = false;
  syncAgentMeta();
  renderRoom();
  refreshRooms();
}

function renderRoom() {
  const r = state.room;
  $('topbar').style.display = r ? 'flex' : 'none';
  $('composer-wrap').style.display = r ? 'block' : 'none';
  $('empty-state').style.display = r ? 'none' : 'flex';
  $('chat').style.display = r ? 'block' : 'none';
  if (!r) return;
  $('room-title').textContent = r.title;
  $('room-members').textContent = r.participants.map(participantDisplay).join(' · ');
  $('crosstalk-btn').textContent = 'Ring: ' + (r.crosstalk ? 'on' : 'off');
  $('crosstalk-btn').classList.toggle('on', r.crosstalk);
  $('code-btn').textContent = 'Code: ' + (state.codeMode ? 'on' : 'off');
  $('code-btn').classList.toggle('on', state.codeMode);
  $('code-btn').title = r.workspace
    ? `Coding mode — qualified coding agents edit ${r.workspace}; chat-only subscription agents review without file access`
    : 'Coding mode — set a shared git workspace; only qualified coding agents receive file access';
  const chat = $('chat');
  chat.innerHTML = '';
  for (const m of r.messages) {
    if (m.sender === 'court') {
      try { chat.appendChild(verdictCard(JSON.parse(m.raw))); continue; } catch (e) {}
    }
    chat.appendChild(messageEl(m.sender, m.content, m.raw));
  }
  renderTargetChips();
  chat.scrollTop = chat.scrollHeight;
}

function messageEl(sender, content, raw) {
  const div = document.createElement('div');
  const isUser = sender === 'user';
  div.className = 'msg' + (isUser ? ' user' : '');
  const who = isUser ? 'You' : sender === 'court' ? 'Court' : labelOf(sender);
  let tools = '';
  if (raw) tools =
    `<button class="raw-btn">ring</button><span class="raw-view" style="display:none">${esc(raw)}</span>`;
  // stored coding-mode diffs arrive as ```diff blocks — render them as panels
  const dm = content.startsWith('```diff')
    ? content.replace(/^```diff\n?/, '').replace(/\n?```\s*$/, '') : null;
  div.innerHTML =
    `<div class="who"><span class="dot" style="background:${isUser ? 'var(--user)' : colorOf(sender)}"></span>
     <b>${esc(who)}</b>${tools}</div>
     <div class="bubble">${dm ? `<pre class="diffview">${esc(dm)}</pre>` : esc(content)}</div>`;
  if (raw) {
    const btn = div.querySelector('.raw-btn'), view = div.querySelector('.raw-view');
    btn.onclick = () => { view.style.display = view.style.display === 'none' ? 'block' : 'none'; };
  }
  return div;
}

function diffMessageEl(agent, diff) {
  const div = document.createElement('div');
  div.className = 'msg diff-msg';
  div.innerHTML =
    `<div class="who"><span class="dot" style="background:${colorOf(agent)}"></span>
     <b>${esc(labelOf(agent))}</b> <span class="ring-kind">🔨 patch committed</span></div>
     <pre class="diffview">${esc(diff)}</pre>`;
  return div;
}

function ringMessageEl(agent, env, decoded, tokensSaved) {
  const div = document.createElement('div');
  div.className = 'msg ring-msg';
  const kind = env && env.kind ? esc(env.kind) : 'ring';
  div.innerHTML =
    `<div class="who"><span class="dot" style="background:${colorOf(agent)}"></span>
     <b>${esc(labelOf(agent))}</b>
     <button class="raw-btn">raw envelope</button>
     <span class="raw-view" style="display:none">${esc(JSON.stringify(env, null, 2))}</span></div>
     <div class="bubble"><span class="ring-kind">◈ ${kind} → room</span>\n${esc(decoded)}
     ${tokensSaved > 4 ? `<div class="toksaved">~${tokensSaved} tokens saved by ring</div>` : ''}</div>`;
  div.querySelector('.raw-btn').onclick = (e) => {
    const v = div.querySelector('.raw-view');
    v.style.display = v.style.display === 'none' ? 'block' : 'none';
  };
  return div;
}

function verdictCard(tally) {
  const div = document.createElement('div');
  div.className = 'verdict-card';
  const total = Object.values(tally.counts || {}).reduce((a, b) => a + b, 0) || 1;
  const max = Math.max(...Object.values(tally.counts || {x: 1}));
  const bars = Object.entries(tally.counts || {})
    .map(([choice, n]) =>
      `<div class="bar-row"><span style="width:70px">${esc(choice)}</span>
       <div class="bar" style="width:${(n / max) * 180}px"></div>
       <span style="color:var(--dim)">${n}/${total}</span></div>`).join('');
  const votes = (tally.votes || []).map(v =>
    `<div class="vote-row"><b style="color:${colorOf(v.agent)}">${esc(labelOf(v.agent))}</b>
     → <b>${esc(v.choice)}</b> <span class="r">(conf ${v.confidence}) ${esc(v.rationale || '')}</span></div>`).join('');
  div.innerHTML =
    `<div class="vh">⚖ VERDICT${tally.unanimous ? ' — UNANIMOUS' : ''}: ${esc(tally.majority || '?')}</div>
     <div class="vb">${bars}
     <div class="q">mean confidence ${(tally.mean_confidence || 0).toFixed(2)}${(tally.dissent || []).length ? ` · ${tally.dissent.length} dissent${tally.dissent.length > 1 ? 's' : ''}` : ''}</div>
     <div class="votes">${votes}</div></div>`;
  return div;
}

function typingEl(agent, label) {
  const div = document.createElement('div');
  div.className = 'typing';
  div.dataset.agent = agent;
  div.textContent = `${label} is drafting…`;
  return div;
}

function renderTargetChips() {
  const wrap = $('targets');
  wrap.innerHTML = '';
  for (const p of state.room.participants) {
    const chip = document.createElement('span');
    chip.className = 'tchip';
    const on = state.selected.size === 0 || state.selected.has(p.id);
    if (on) { chip.classList.add('sel', 'on'); chip.style.color = colorOf(p.id); }
    chip.textContent = participantDisplay(p) + (state.selected.size === 0 ? '' : (on ? ' ✓' : ''));
    if (participantPolicyBlocked(p)) chip.title = 'This legacy participant is preserved in room history but blocked by subscription-only policy.';
    chip.onclick = () => {
      if (state.selected.has(p.id)) state.selected.delete(p.id);
      else state.selected.add(p.id);
      renderTargetChips();
    };
    wrap.appendChild(chip);
  }
}

function participantPolicyBlocked(participant) {
  const canonicalId = canonicalProviderId(participant.id);
  return subscriptionOnly() && !state.models.some((model) => model.id === canonicalId);
}

function participantDisplay(participant) {
  return participant.label + (participantPolicyBlocked(participant) ? ' (policy blocked)' : '');
}

/* ---------------- Send (SSE) ---------------- */

async function send() {
  if (state.busy || !state.room) return;
  const text = $('input').value.trim();
  if (!text) return;
  state.busy = true;
  $('send').disabled = true;
  $('input').value = '';

  const chat = $('chat');
  chat.appendChild(messageEl('user', text, null));

  const streams = {};  // agentId -> {root, bubble}
  const typings = {};  // agentId -> typing el

  const touch = (agent) => {
    if (!streams[agent]) {
      const div = document.createElement('div');
      div.className = 'msg';
      div.innerHTML =
        `<div class="who"><span class="dot" style="background:${colorOf(agent)}"></span><b>${esc(labelOf(agent))}</b></div>
         <div class="bubble"></div>`;
      streams[agent] = {root: div, bubble: div.querySelector('.bubble')};
      chat.appendChild(div);
    }
    return streams[agent];
  };

  const resp = await fetch(`/api/rooms/${state.room.id}/send`, {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({text, targets: [...state.selected],
                          mode: state.codeMode ? 'code' : 'chat'}),
  });
  if (!resp.ok) {
    const err = await resp.json().catch(() => ({}));
    alert(err.detail || 'send failed');
    state.busy = false; $('send').disabled = false;
    return;
  }

  const reader = resp.body.getReader();
  const dec = new TextDecoder();
  let buf = '';
  while (true) {
    const {done, value} = await reader.read();
    if (done) break;
    buf += dec.decode(value, {stream: true});
    let idx;
    while ((idx = buf.indexOf('\n\n')) >= 0) {
      const frame = buf.slice(0, idx).trim();
      buf = buf.slice(idx + 2);
      if (!frame.startsWith('data:')) continue;
      let ev; try { ev = JSON.parse(frame.slice(5)); } catch (e) { continue; }
      handleEvent(ev, {chat, touch, typings, streams});
    }
  }
  // refresh persisted transcript so ids/attrs are canonical
  state.room = await api.room(state.room.id);
  renderRoom();
  state.busy = false;
  $('send').disabled = false;
  $('input').focus();
}

function handleEvent(ev, ctx) {
  const {chat, touch, typings} = ctx;
  switch (ev.type) {
    case 'start': {
      const t = typingEl(ev.agent, ev.label);
      typings[ev.agent] = t;
      chat.appendChild(t);
      chat.scrollTop = chat.scrollHeight;
      break;
    }
    case 'delta': {
      if (typings[ev.agent]) { typings[ev.agent].remove(); delete typings[ev.agent]; }
      const s = touch(ev.agent);
      s.bubble.textContent += ev.text;
      chat.scrollTop = chat.scrollHeight;
      break;
    }
    case 'done': {
      if (typings[ev.agent]) { typings[ev.agent].remove(); delete typings[ev.agent]; }
      break;
    }
    case 'error': {
      if (typings[ev.agent]) { typings[ev.agent].remove(); delete typings[ev.agent]; }
      const s = touch(ev.agent);
      s.bubble.innerHTML += `<div style="color:#f87171;font-size:11px;margin-top:4px">⚠ ${esc(ev.error)}</div>`;
      break;
    }
    case 'phase': {
      const p = document.createElement('div');
      p.className = 'typing';
      p.textContent = '— decoder-ring cross-talk —';
      chat.appendChild(p);
      chat.scrollTop = chat.scrollHeight;
      break;
    }
    case 'ring': {
      chat.appendChild(ringMessageEl(ev.agent, ev.envelope, ev.decoded, ev.tokens_saved));
      chat.scrollTop = chat.scrollHeight;
      break;
    }
    case 'diff': {
      chat.appendChild(diffMessageEl(ev.agent, ev.diff));
      chat.scrollTop = chat.scrollHeight;
      break;
    }
    case 'turn_done': break;
  }
}

/* ---------------- Vote ---------------- */

async function callVote() {
  if (!state.room || state.busy) return;
  const q = prompt('Motion for the court (leave blank to vote on your last message):', '');
  if (q === null) return;
  $('vote-btn').disabled = true;
  try {
    const out = await api.vote(state.room.id, q.trim());
    const chat = $('chat');
    if (out.errors && out.errors.length) {
      const d = document.createElement('div');
      d.className = 'typing';
      d.textContent = '⚠ ' + out.errors.map(e => `${labelOf(e.agent)}: ${e.error}`).join(' | ');
      chat.appendChild(d);
    }
    chat.appendChild(verdictCard(out.tally));
    chat.scrollTop = chat.scrollHeight;
  } catch (e) {
    alert(e.message);
  }
  $('vote-btn').disabled = false;
}

/* ---------------- Wire-up ---------------- */

$('new-room-btn').onclick = openModal;
$('add-counsel-btn').onclick = openAddModal;
$('model-rows').onclick = (e) => {
  const button = e.target.closest('.check-model');
  if (button) checkModel(button.dataset.id, button);
};
$('cancel-btn').onclick = () => $('modal-bg').classList.remove('show');
$('create-btn').onclick = createRoom;
$('modal-bg').onclick = (e) => { if (e.target.id === 'modal-bg') $('modal-bg').classList.remove('show'); };
$('send').onclick = send;
$('vote-btn').onclick = callVote;
$('input').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
$('crosstalk-btn').onclick = async () => {
  if (!state.room) return;
  const next = !state.room.crosstalk;
  state.room = await api.patchRoom(state.room.id, {crosstalk: next});
  renderRoom();
};
$('code-btn').onclick = async () => {
  if (!state.room) return;
  if (!state.codeMode && !state.room.workspace) {
    const ws = prompt('Path to the shared git workspace for coding mode\n(created and git-inited if missing):',
                      state.room.title.replace(/[^\w.-]+/g, '-').toLowerCase());
    if (ws === null || !ws.trim()) return;
    state.room = await api.patchRoom(state.room.id, {workspace: ws.trim()});
  }
  state.codeMode = !state.codeMode;
  renderRoom();
};

(async function init() {
  try {
    state.setup = await api.setup();
  } catch (e) {
    // Settings endpoint unreachable: keep the safe subscription-only default.
  }
  $('add-counsel-btn').title = subscriptionOnly()
    ? 'Add subscription counsel to this room'
    : 'Add models to this room — subscription, API, or local, even mid-conversation';
  if (state.setup && state.setup.first_run && !subscriptionOnly()) {
    location.replace('/setup');
    return;
  }
  try {
    await refreshModels();
    await refreshRooms();
  } catch (e) {
    alert('Failed to load models: ' + e.message);
  }
})();
</script>
